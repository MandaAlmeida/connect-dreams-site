<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Dreams — Desenvolvimento de software sob medida</title>
    <meta
      name="description"
      content="Desenvolvimento de sistemas web, APIs, aplicativos, integrações com IA e automação de processos — do entendimento do problema à entrega e evolução."
    />
    <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Connect Dreams — Desenvolvimento de software sob medida" />
    <meta property="og:description" content="Sistemas web, APIs, aplicativos, integrações com IA e automação de processos." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d6361b'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there is no light flash in dark mode.
      try {
        var t = localStorage.getItem('cd-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Connect Dreams: desenvolvimento de software sob medida. Ative o JavaScript para ver o site completo.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
